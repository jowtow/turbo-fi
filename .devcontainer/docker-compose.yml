services:
  devcontainer:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    volumes:
      - ..:/workspaces/turbo-fi:cached
      - nuget-cache:/home/vscode/.nuget/packages
      - web-node-modules:/workspaces/turbo-fi/src/turbo-fi-web/node_modules
    environment:
      ConnectionStrings__TurboFi: "Server=database;Database=TurboFi;User Id=sa;Password=${MSSQL_SA_PASSWORD:-TurboFiDev!123};TrustServerCertificate=True"
      ASPNETCORE_URLS: "http://0.0.0.0:8080"
    depends_on:
      database:
        condition: service_healthy

  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-TurboFiDev!123}"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  nuget-cache:
  web-node-modules:
  sqlserver-data:
