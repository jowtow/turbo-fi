; Manages all three processes inside the standalone container.
; supervisord is started by /entrypoint.sh which exports all required env vars
; before exec-ing this process, so each program inherits them automatically.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

; SQL Server starts first — it will initialise the data directory on first run
[program:mssql]
command=/opt/mssql/bin/sqlservr
priority=10
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; nginx can start immediately — it doesn't depend on the API or DB
[program:nginx]
command=nginx -g "daemon off;"
priority=10
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; The API waits for SQL Server to respond before starting dotnet
[program:api]
command=/app/wait-for-mssql.sh
priority=20
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
